workflows:
  android-apk-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Extract zip and setup project
        script: |
          unzip -o *.zip || true
          if [ -d "tryuo_app" ]; then
            cp -rf tryuo_app/* . || true
          fi
          flutter create . --platforms=android --org=com.tryuo.app
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Extract Zip Files
        run: |
          unzip -o *.zip || true
          if [ -d "tryuo_app" ]; then
            cp -rf tryuo_app/* . || true
          fi

      - name: Create Android Configs
        run: flutter create . --platforms=android --org=com.tryuo.app

      - name: Fix Code Typo Errors
        run: |
          find lib/ -type f -exec sed -i 's/dart0:convert/dart:convert/g' {} + || true

      - name: Install Dependencies
        run: flutter pub get || true

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRYUO-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
